<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6D2D"/>
    </linearGradient>
  </defs>

  <!-- Circular Luxury Seal / Insignia -->
  <g transform="translate(60, 60)">
    <circle r="46" fill="none" stroke="url(#goldRing)" stroke-width="2.5" opacity="0.9" />
    <circle r="40" fill="none" stroke="url(#goldRing)" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
    <circle r="36" fill="#FAF9F5" />
    
    <!-- Stylized Luxury Four-Point Star -->
    <path d="M0 -22 L4 -5 L22 0 L4 5 L0 22 L-4 5 L-22 0 L-4 -5 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3" fill="#141414" />
  </g>

  <!-- Typography: YOUR PERFUME BRAND -->
  <text x="135" y="52" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="0.2em" 
        fill="#18181B">
    YOUR PERFUME BRAND
  </text>
  
  <!-- Pill Tag: FOR SALE -->
  <rect x="385" y="36" width="62" height="20" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="416" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#166534">FOR SALE</text>

  <!-- Subtitle: Built for Nigeria -->
  <text x="137" y="78" 
        font-family="'JetBrains Mono', monospace" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="0.22em" 
        fill="#C5A059">
    READY-MADE STORE • BUILT FOR NIGERIA
  </text>
</svg>
