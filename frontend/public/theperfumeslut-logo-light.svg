<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="tpsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8C6512" />
    </linearGradient>
  </defs>

  <!-- Group: Perfume Atomizer & Ring -->
  <g transform="translate(200, 85)" text-anchor="middle">
    <!-- Spray Atomizer Cap -->
    <rect x="-10" y="-76" width="20" height="7" rx="1.5" fill="url(#tpsGold)" />
    <!-- Atomizer head with nozzle -->
    <path d="M-8 -76 H8 V-62 C8 -60, -8 -60, -8 -62 Z" fill="url(#tpsGold)" />
    <path d="M-7 -76 C-7 -80, 5 -80, 5 -76" stroke="url(#tpsGold)" stroke-width="2" fill="none" />
    <!-- Nozzle orifice pointing up-right -->
    <rect x="5" y="-73" width="4" height="3" rx="0.5" fill="#3D2B0F" />
    <!-- Spray mist droplets -->
    <circle cx="15" cy="-78" r="1.8" fill="#B8860B" opacity="0.9" />
    <circle cx="21" cy="-84" r="1.3" fill="#C5A059" opacity="0.8" />
    <circle cx="26" cy="-80" r="1.5" fill="#8C6512" opacity="0.85" />
    <circle cx="22" cy="-73" r="1.1" fill="#C5A059" opacity="0.75" />
    <circle cx="29" cy="-88" r="1.2" fill="#B8860B" opacity="0.7" />

    <!-- Circular Bottle Ring (Golden Ring) -->
    <circle cx="0" cy="0" r="48" stroke="url(#tpsGold)" stroke-width="11" fill="none" />
    <!-- Inner subtle decorative rim -->
    <circle cx="0" cy="0" r="41" stroke="#AA771C" stroke-width="1" fill="none" opacity="0.4" />

    <!-- TPS Monogram (Cursive Script in Dark Obsidian) -->
    <text x="0" y="9" font-family="'Pinyon Script', 'Brush Script MT', 'Great Vibes', cursive" font-size="34" font-weight="600" fill="#141414" font-style="italic" letter-spacing="1">tps</text>
  </g>

  <!-- Group: Flourish Swirl Accents -->
  <g stroke="url(#tpsGold)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9">
    <!-- Left flourish swoosh -->
    <path d="M 35 188 Q 110 188, 160 176" />
    <path d="M 50 188 Q 20 188, 30 193 Q 45 197, 80 194" stroke-width="1" opacity="0.6" />
    <!-- Right flourish swoosh -->
    <path d="M 240 176 Q 290 188, 365 188" />
    <path d="M 350 188 Q 380 188, 370 193 Q 355 197, 320 194" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Typography: The (Dark obsidian script) -->
  <text x="200" y="174" text-anchor="middle" font-family="'Pinyon Script', 'Great Vibes', 'Brush Script MT', cursive" font-size="44" fill="#141414" font-style="italic" font-weight="600">The</text>

  <!-- Typography: Perfume Slut (Gold script) -->
  <text x="200" y="244" text-anchor="middle" font-family="'Pinyon Script', 'Great Vibes', 'Brush Script MT', cursive" font-size="62" fill="url(#tpsGold)" font-style="italic" font-weight="normal" letter-spacing="0.5">Perfume Slut</text>
</svg>
